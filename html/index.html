<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Parker - Registro de Ingreso</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <header>
            <h1>Peter Parker</h1>
            <p>Ingreso de Acceso de Vehículos</p>
        </header>

        <form action="/registrar" method="POST">
            <p class="grupo-formulario">
                <label for="placa">Placa del Vehículo:</label>
                <input type="text" id="placa" name="placa" placeholder="Ej: ABC123 o ABC12D" maxlength="7" required>
            </p>

            <button type="submit" class="boton-registrar">Registrar Ingreso</button>
            <p id="mensaje" role="status">MENSAJE</p>
        </form>

        <section>
            <h2>Vehículos registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Placa</th>
                        <th>Tipo</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody>
                    FILAS
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
